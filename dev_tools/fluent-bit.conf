[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         tail
    # 💡 .txt를 빼고 실제 파일명인 access.log로 맞췄습니다.
    # 💡 윈도우 경로 인식을 위해 슬래시(/)를 사용했습니다.
    Path         C:/Projects/2026_kw_capstone_project/dev_tools/logs/access.log
    Tag          security.log
    Refresh_Interval 1
    # 💡 처음부터 읽도록 옵션 추가
    Read_from_Head True

[OUTPUT]
    Name        kafka
    Match       *
    Brokers     localhost:9092
    Topics      log-topic
    # 💡 중요: 스프링 부트에서 String으로 받으려면 형식을 지정해야 합니다.
    # 포맷을 지정하지 않으면 바이너리 데이터로 넘어가서 파싱이 안 될 수 있습니다.
    Format      json
