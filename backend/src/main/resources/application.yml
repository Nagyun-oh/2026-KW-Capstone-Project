spring:
  session:
    jdbc:
      initialize-schema: always
  datasource:
    url: jdbc:mysql://localhost:3306/security_db?serverTimezone=Asia/Seoul
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true > 2
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: log-group
      auto-offset-reset: earliest     # 컨슈머가 처음 연결됐을 때, 이전에 쌓여있던 데이터가 있다면 처음부터 다 읽어오겠다는 뜻
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
# Spring Boot Actuator가 어떤 운영/성능 정보를 외부에 보여줄지 정함.
management:
  # 웹으로 접근 가능한 Acutator endpoint를 열어주는 설정
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # HTTP API 요청 지표에 대해 히스토그램 데이터를 만들겠다
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # 응답 시간 기준선
      slo:
        http.server.requests: 100ms,300ms,1s
# 이 스프링 프로젝트가 실행될 때 사용하는 포트번호. 웹 브라우저에서 localhost:8080으로 접속하게됨.
server:
  port: 8080

# WAF는 모든 요청을 검사하고 Kafka까지 전달한다.
# 아래 조건을 모두 만족하는 정상 정적 요청만 DB 저장과 AI 분석에서 제외한다.
security:
  log-filter:
    static-resource:
      enabled: true
      path-prefixes:
        - /assets/
        - /media/
      content-types:
        - image/
        - font/
        - text/css
      # 304 응답은 Content-Type이 없을 수 있어, 이때만 확장자를 보조 조건으로 사용한다.
      extensions:
        - .png
        - .jpg
        - .jpeg
        - .gif
        - .webp
        - .svg
        - .ico
        - .woff
        - .woff2
        - .ttf
        - .css
      methods:
        - GET
        - HEAD
