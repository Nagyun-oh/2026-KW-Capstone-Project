# =============================================================
# CUSTOM-002: IP 블랙리스트
#
# 백엔드 BlacklistService에서 차단된 IP를 이 파일에 추가.
# 백엔드가 이 파일을 직접 업데이트하거나,
# 수동으로 관리할 수 있음.
#
# 추가 방법:
#   SecRule REMOTE_ADDR "@ipMatch 1.2.3.4" \
#       "id:20001,phase:1,deny,status:403,log,msg:'Blacklisted IP'"
#
# 주의: id는 20001부터 순서대로 증가시켜 사용
# =============================================================

# 예시 (실제 차단할 IP로 교체)
# SecRule REMOTE_ADDR "@ipMatch 192.168.1.100" \
#     "id:20001,\
#     phase:1,\
#     deny,\
#     status:403,\
#     log,\
#     msg:'Blacklisted IP - Auto blocked by backend',\
#     tag:'custom/blacklist'"
