# =============================================================
# OWASP CRS 설정 파일
# AI 모델(LightGBM) 기반 탐지 로직과 연계된 WAF 설정
# =============================================================

# 파라노이아 레벨: 1~4
# 1 = 기본, 2 = 강화 (SQLi/XSS 추가 탐지), 3~4 = 매우 엄격
# AI 모델이 2차 탐지를 담당하므로 2로 설정
SecAction \
    "id:900000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.paranoia_level=2"

# 블로킹 파라노이아 레벨: 실제 차단에 적용할 레벨
SecAction \
    "id:900001,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.blocking_paranoia_level=1"

# 인바운드 임계값: 이 점수를 초과하면 요청 차단
# AI 모델이 따로 탐지하므로 넉넉하게 설정
SecAction \
    "id:900110,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.inbound_anomaly_score_threshold=10"

# 아웃바운드 임계값
SecAction \
    "id:900200,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.outbound_anomaly_score_threshold=5"

# 샘플링 비율: 100% 검사
SecAction \
    "id:900400,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.sampling_percentage=100"
