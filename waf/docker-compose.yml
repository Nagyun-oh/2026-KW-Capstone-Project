services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    ports:
      - "${WAF_PORT:-80}:8080"
    environment:
      - BACKEND=${BACKEND_URL:-http://host.docker.internal:8080}
      - PORT=8080
      - MODSEC_RULE_ENGINE=On
      - PARANOIA=2
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=3
      - BLOCKING_PARANOIA=1
    volumes:
      - ./rules/CUSTOM-001-ai-align.conf:/etc/modsecurity.d/owasp-crs/rules/CUSTOM-001-ai-align.conf
      - ./rules/CUSTOM-002-blacklist.conf:/etc/modsecurity.d/owasp-crs/rules/CUSTOM-002-blacklist.conf
      - ./logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"

  fluent-bit:
    image: fluent/fluent-bit:2.2
    container_name: waf-fluent-bit
    depends_on:
      - waf
    volumes:
      - ./logs:/var/log/nginx:ro
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./parsers.conf:/fluent-bit/etc/parsers.conf:ro

networks:
  default:
    name: security-net
