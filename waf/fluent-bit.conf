[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/nginx/access.log
    Tag               waf.access
    Parser            nginx_access
    Read_from_Head    False
    Refresh_Interval  1

[INPUT]
    Name              tail
    Path              /var/log/nginx/error.log
    Tag               waf.error
    Parser            nginx_error
    Read_from_Head    False
    Refresh_Interval  1

[OUTPUT]
    Name        kafka
    Match       waf.access
    Brokers     kafka:29092
    Topics      log-topic
    Format      json

[OUTPUT]
    Name        kafka
    Match       waf.error
    Brokers     kafka:29092
    Topics      waf-error-topic
    Format      json
